<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- پس‌زمینه سرمه‌ای مهندسی (Blueprint Navy Gradient) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- هاله نوری طلایی/آبی در پس‌زمینه -->
    <radialGradient id="glowGrad" cx="70%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- گرادینت تخته شاسی / بدنه گزارش -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- گرادینت کلاه ایمنی مهندسی (Safety Amber 3D) -->
    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="helmetRib" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- گرادینت تیک سبز تأیید گزارش -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- سایه نرم اجزا -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.55" />
    </filter>
    <filter id="helmetShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020617" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ۱. قاب اصلی آیکن اندروید (Adaptive Squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glowGrad)" />

  <!-- ۲. خطوط شبکه نقشه مهندسی (Blueprint Grid) -->
  <g stroke="#3B82F6" stroke-opacity="0.12" stroke-width="2">
    <line x1="96" y1="16" x2="96" y2="496" />
    <line x1="176" y1="16" x2="176" y2="496" />
    <line x1="256" y1="16" x2="256" y2="496" />
    <line x1="336" y1="16" x2="336" y2="496" />
    <line x1="416" y1="16" x2="416" y2="496" />
    <line x1="16" y1="96" x2="496" y2="96" />
    <line x1="16" y1="176" x2="496" y2="176" />
    <line x1="16" y1="256" x2="496" y2="256" />
    <line x1="16" y1="336" x2="496" y2="336" />
    <line x1="16" y1="416" x2="496" y2="416" />
  </g>

  <!-- کادر طلایی ظریف داخلی -->
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="#F59E0B" stroke-opacity="0.22" stroke-width="2.5" />

  <!-- ۳. تخته شاسی و برگه گزارش روزانه (در سمت راست/مرکز) -->
  <g filter="url(#dropShadow)">
    <!-- بدنه کلیپ‌بورد -->
    <rect x="108" y="88" width="248" height="316" rx="28" fill="url(#boardGrad)" stroke="#CBD5E1" stroke-width="3" />
    
    <!-- هدر سرمه‌ای بالای برگه گزارش -->
    <path d="M108 116 C108 100.5 120.5 88 136 88 H328 C343.5 88 356 100.5 356 116 V148 H108 Z" fill="#1D4ED8" />

    <!-- گیره فلزی بالای تخته شاسی -->
    <rect x="184" y="68" width="96" height="34" rx="12" fill="#475569" stroke="#94A3B8" stroke-width="3" />
    <circle cx="232" cy="85" r="6" fill="#E2E8F0" />

    <!-- خطوط و نمودارهای داخل برگه گزارش -->
    <!-- ردیف اول: تیک و نوار عنوان -->
    <rect x="136" y="174" width="20" height="20" rx="6" fill="#10B981" />
    <rect x="168" y="178" width="144" height="12" rx="6" fill="#1E293B" />

    <!-- ردیف دوم: تیک و نوار کیلومتراژ -->
    <rect x="136" y="210" width="20" height="20" rx="6" fill="#3B82F6" />
    <rect x="168" y="214" width="112" height="12" rx="6" fill="#64748B" />

    <!-- نمودار میله‌ای پیشرفت کارگاهی روی برگه -->
    <rect x="140" y="286" width="22" height="44" rx="5" fill="#93C5FD" />
    <rect x="172" y="268" width="22" height="62" rx="5" fill="#3B82F6" />
    <rect x="204" y="250" width="22" height="80" rx="5" fill="#1D4ED8" />
    <rect x="236" y="236" width="22" height="94" rx="5" fill="#10B981" />

    <!-- خط‌کش اشل مهندسی در حاشیه چپ برگه -->
    <rect x="108" y="148" width="14" height="256" fill="#F59E0B" opacity="0.9" />
    <g stroke="#0F172A" stroke-width="2.5">
      <line x1="108" y1="175" x2="118" y2="175" />
      <line x1="108" y1="205" x2="116" y2="205" />
      <line x1="108" y1="235" x2="118" y2="235" />
      <line x1="108" y1="265" x2="116" y2="265" />
      <line x1="108" y1="295" x2="118" y2="295" />
      <line x1="108" y1="325" x2="116" y2="325" />
      <line x1="108" y1="355" x2="118" y2="355" />
    </g>
  </g>

  <!-- ۴. نشان دایره‌ای سبز «تأیید و ثبت نهایی» در بالا-چپ -->
  <g filter="url(#helmetShadow)">
    <circle cx="352" cy="144" r="42" fill="url(#checkGrad)" stroke="#FFFFFF" stroke-width="6" />
    <path d="M333 144 L346 157 L373 130" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ۵. کلاه ایمنی مهندسی سه‌بعدی (Safety Hardhat) در پایین-چپ/مرکز -->
  <g filter="url(#helmetShadow)">
    <!-- کاسه اصلی کلاه ایمنی -->
    <path d="M188 378 C188 296 244 242 314 242 C384 242 440 296 440 378 Z" fill="url(#helmetGrad)" />

    <!-- نوار شبرنگ ایمنی سفید/نقره‌ای روی کلاه -->
    <path d="M196 352 Q314 334 432 352 L435 366 Q314 348 193 366 Z" fill="#FFFBEB" opacity="0.88" />

    <!-- برجستگی میانی (تیغه تقویتی بالای کلاه مهندسی) -->
    <path d="M294 243 C294 230 302 224 314 224 C326 224 334 230 334 243 L328 352 H300 Z" fill="url(#helmetRib)" />

    <!-- شیارهای کناری کلاه -->
    <path d="M254 256 Q270 300 266 350" fill="none" stroke="#B45309" stroke-width="4" stroke-linecap="round" opacity="0.55" />
    <path d="M374 256 Q358 300 362 350" fill="none" stroke="#B45309" stroke-width="4" stroke-linecap="round" opacity="0.55" />

    <!-- لبه و نقاب جلوی کلاه ایمنی (Visor) -->
    <rect x="168" y="372" width="292" height="24" rx="12" fill="#FBBF24" stroke="#B45309" stroke-width="3" />
    <rect x="182" y="376" width="264" height="8" rx="4" fill="#FEF08A" opacity="0.7" />
  </g>
</svg>
